<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Villa - Realtà Aumentata</title>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
</script>

<style>

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f3ef;
    color: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.contenuto {
    width: 90%;
    max-width: 500px;
}

h1 {
    font-size: 30px;
    font-weight: 400;
    margin-bottom: 15px;
}

p {
    font-size: 16px;
    line-height: 1.5;
    margin-bottom: 30px;
}

button {
    background: #111;
    color: white;
    border: none;
    border-radius: 40px;
    padding: 18px 30px;
    font-size: 17px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.5;
}

.piccolo {
    margin-top: 20px;
    font-size: 13px;
    opacity: 0.65;
}

/* Il modello viene caricato ma NON viene mostrato */
model-viewer {
    position: fixed;
    top: 0;
    left: 0;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
}

</style>
</head>

<body>

<model-viewer
    id="modelloAR"
    loading="eager"
    src="villa.glb"
    ios-src="villa.usdz"
    ar
    ar-modes="scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="fixed">
</model-viewer>

<div class="contenuto">

    <h1>Immaginare non basta più.</h1>

    <p>
        Guarda il progetto direttamente nel tuo spazio.
    </p>

    <button id="pulsanteAR" disabled>
        PREPARAZIONE...
    </button>

    <div class="piccolo" id="messaggio">
        Nessuna app da installare.
    </div>

</div>

<script>

const modello = document.getElementById("modelloAR");
const pulsante = document.getElementById("pulsanteAR");
const messaggio = document.getElementById("messaggio");

modello.addEventListener("load", () => {

    pulsante.disabled = false;
    pulsante.innerText = "APRI IN REALTÀ AUMENTATA";

});

pulsante.addEventListener("click", async () => {

    if (!modello.canActivateAR) {

        messaggio.innerText =
        "La realtà aumentata non è disponibile su questo dispositivo.";

        return;
    }

    try {

        await modello.activateAR();

    } catch (errore) {

        messaggio.innerText =
        "Non è stato possibile avviare la realtà aumentata.";

    }

});

</script>

</body>
</html>
